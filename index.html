      <label class="group"><span class="label">Note for week ${bw}</span><textarea id="bn-${P}-${di}-${wi}-note" data-prog="daynote" data-w="${wi}" rows="2" placeholder="e.g. Focus on slow lowering this week">${esc(day.notes[wi])}</textarea></label>
      <div class="row">
        ${bw > 1 ? `<button type="button" class="btn ${armedCopy ? 'armed' : ''}" data-act="copyprev">${armedCopy ? 'Tap again to replace week ' + bw : 'Copy week ' + (bw - 1)}</button>` : ''}
        ${day.type === 'weights' ? `<button type="button" class="chip" data-act="ss" data-v="${wi}" aria-pressed="${!!day.superset[wi]}">Supersets ${day.superset[wi] ? 'on' : 'off'}</button>` : ''}
      </div>
    </section>`;

  if (day.type === 'cardio'){
    const r = day.cardio[wi];
    h += `<section class="card"><h3>Cardio</h3><div class="wkf">
      <label class="wide"><span class="label">Activity</span><input id="bc-${P}-${di}-${wi}-activity" data-prog="cardio" data-w="${wi}" data-k="activity" value="${esc(r.activity)}" placeholder="Run" autocomplete="off"></label>
      <label class="wide"><span class="label">Duration</span><input id="bc-${P}-${di}-${wi}-duration" data-prog="cardio" data-w="${wi}" data-k="duration" value="${esc(r.duration)}" placeholder="30 min" autocomplete="off"></label>
    </div></section>`;
    return h;
  }
  /* Exercises: one line each; tap one to edit it. */
  day.exercises.forEach((ex, ei) => {
    const r = ex.weeks[wi], off = !setCount(r.sets), open = ui.exOpen === ex.id, arm = ui.armed === ex.id;
    const f = (k, label, ph2, cls) => `<label class="${cls || ''}"><span class="label">${label}</span><input id="bw-${ex.id}-${wi}-${k}" data-prog="wk" data-ex="${ex.id}" data-w="${wi}" data-k="${k}" value="${esc(r[k])}" placeholder="${ph2}" autocomplete="off"></label>`;
    h += `<section class="card exc ${off && !open ? 'off' : ''}">
      <button type="button" class="exrow" data-act="exopen" data-v="${ex.id}" aria-expanded="${open}"><span class="lt">${ex.group}</span>
        <span class="exmid"><b>${esc(ex.name || 'New exercise')}</b><span class="note">${esc(exSummary(ex, wi))}</span></span><span class="chev" aria-hidden="true">›</span></button>
      ${open ? `<div class="exedit">
        <label class="group"><span class="label">Exercise</span><input id="be-${ex.id}" class="exn" data-prog="exname" data-ex="${ex.id}" value="${esc(ex.name)}" placeholder="Exercise name" autocomplete="off"></label>
        <div class="wkf">${f('warm', 'Warm-up', '0')}${f('sets', 'Sets', '3')}${f('reps', 'Reps', '8')}${f('note', 'Technique (optional)', 'e.g. Paused reps', 'wide')}</div>
        <div class="row"><span class="label">Group</span><div class="seg sm">${LET.map(L => `<button type="button" data-act="grp" data-ex="${ex.id}" data-v="${L}" aria-pressed="${ex.group === L}">${L}</button>`).join('')}</div></div>
        <div class="row between"><div class="row">
          <button type="button" class="btn" data-act="up" data-ex="${ex.id}" ${ei === 0 ? 'disabled' : ''} aria-label="Move up">↑</button>
          <button type="button" class="btn" data-act="down" data-ex="${ex.id}" ${ei === day.exercises.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></div>
          ${off ? '' : `<button type="button" class="btn danger ${arm ? 'armed' : ''}" data-act="rm" data-ex="${ex.id}">${arm ? 'Tap to confirm' : 'Remove from week ' + bw}</button>`}</div>
      </div>` : ''}
    </section>`;
  });
  h += `<button type="button" class="btn primary big" data-act="addex">+ Add exercise</button>`;
  return h;
}

/* ---------- events ---------- */
const app = document.getElementById('app');
app.addEventListener('submit', e => {
  if (e.target.id !== 'coach-form') return;
  e.preventDefault();
  const p = document.getElementById('coach-pin').value.trim(), msg = document.getElementById('coach-msg');
  msg.textContent = 'Checking…';
  api('checkPin', p).then(ok => {
    if (ok){ ls.set('sb.pin', p); mode = 'loading'; render(); load(); }
    else msg.textContent = 'That PIN is wrong.';
  }, () => { msg.textContent = 'Could not check the PIN. Check your connection.'; });
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-act="tab"]'); if (!b) return;
  ui.tab = b.dataset.v; ui.armed = null; render(); window.scrollTo(0, 0);
});
const curPerson = () => isCoach() ? (ui.tab === 'me' && selfClient() ? selfClient().id : ui.person) : me.id;
function move(delta){
  const person = curPerson(), n = nDays(person), i = pos2idx(getPos(person), n) + delta;
  if (i < 0 || i >= totalFor(person)) return;
  setPos(person, idx2pos(i, n)); window.scrollTo(0, 0);
}
function armFor(key){ ui.armed = key; setTimeout(() => { if (ui.armed === key){ ui.armed = null; safeRender(); } }, 4000); }
function copyLink(c){
  const input = document.getElementById('lk-' + c.id), text = linkFor(c);
  const done = () => { ui.copied = c.id; render(); setTimeout(() => { if (ui.copied === c.id){ ui.copied = ''; safeRender(); } }, 2000); };
  const fallback = () => { try { input.focus(); input.select(); document.execCommand('copy') ? done() : null; } catch(_){} };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(_){ fallback(); }
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  const prog = isCoach() ? progById(ui.pid) : null, day = prog ? prog.days[ui.bDay] : null;
  const ex = b.dataset.ex && day ? day.exercises.find(x => x.id === b.dataset.ex) : null;
  const cl = b.dataset.c ? clientById(b.dataset.c) : null;
  if (!['rm','rmclient','newlink','rmprog','ndays','copyprev'].includes(act)) ui.armed = null;
  switch (act){
    case 'prev': move(-1); break;
    case 'next': move(1); break;
    case 'gonext': setPos(curPerson(), idx2pos(expectedIdx(curPerson()), nDays(curPerson()))); window.scrollTo(0, 0); break;
    case 'pushon': {
      const OS = window.__OS; if (!OS || push.asking) return;
      push.asking = true;
      /* must run straight from the tap so the phone shows its Allow prompt */
      OS.Notifications.requestPermission().then(() => OS.User.PushSubscription.optIn()).catch(() => {}).finally(() => { push.asking = false; push.on = !!(OS.Notifications.permission && OS.User.PushSubscription.optedIn); render(); });
      break; }
    case 'warm': {
      const person = curPerson(), p = getPos(person), l = ensureLog(person, p.week, p.day), i = +b.dataset.i;
      l.warm = Object.assign({}, l.warm); const a = (l.warm[b.dataset.ex] || []).slice();
      while (a.length <= i) a.push(false);
      a[i] = !a[i]; l.warm[b.dataset.ex] = a;
      scheduleLogSave(logId(person, p.week, p.day)); break; }
    case 'plen': if (prog){ prog.len = +v === 12 ? 12 : 8; scheduleDataSave(); } break;
    case 'bweek': if (prog){ if (!ui.bWeek) ui.bWeek = {}; ui.bWeek[prog.id] = +v; } break;
    case 'bwmove': if (prog){ if (!ui.bWeek) ui.bWeek = {}; ui.bWeek[prog.id] = Math.min(lenOf(prog), Math.max(1, bwIdx(prog) + 1 + (+v))); ui.armed = null; } break;
    case 'exopen': ui.exOpen = ui.exOpen === v ? null : v; break;
    case 'ckopen': ui.ckOpen = true; break;
    case 'ckreply': {
      const ta = document.getElementById('ck-text'), text = (ta ? ta.value : '').trim();
      if (!text || ui.ckBusy) return;
      ui.ckText = text; ui.ckBusy = true; ui.ckErr = false; render();
      api('replyCheckin', CODE, text).then(() => { ui.ckSent = true; ui.ckText = ''; myCheckin = false; saveCache(); }, () => { ui.ckErr = true; })
        .finally(() => { ui.ckBusy = false; render(); });
      return; }
    case 'msgall': ui.msgAll = !ui.msgAll; break;
    case 'msgread': msgs.forEach(m => { m.read = true; }); saveCache(); api('readMessages', pin()).catch(() => {}); break;
    case 'copyprev': {
      if (!prog || !day) return; const wi = bwIdx(prog); if (wi < 1) return;
      const key = 'cp:' + prog.id + ':' + ui.bDay + ':' + (wi + 1);
      if (weekPlanned(day, wi) && ui.armed !== key){ armFor(key); break; }
      day.exercises.forEach(x => { x.weeks[wi] = clone(x.weeks[wi - 1]); x.custom = x.weeks.some(r => !sameRow(r, x.weeks[0])); });
      day.superset[wi] = !!day.superset[wi - 1];
      day.cardio[wi] = clone(day.cardio[wi - 1]); day.cardioCustom = day.cardio.some(r => !sameRow(r, day.cardio[0]));
      ui.armed = null; scheduleDataSave(); break; }
    case 'finish': {
      const person = curPerson(), p = getPos(person), l = ensureLog(person, p.week, p.day);
      l.done = true; scheduleLogSave(logId(person, p.week, p.day), true); move(1); break; }
    /* clients */
    case 'copy': if (cl) copyLink(cl); return;
    case 'addclient': {
      const name = document.getElementById('nc-name').value.trim(), pid = document.getElementById('nc-prog').value;
      if (!name){ document.getElementById('nc-msg').textContent = 'Add a name first.'; return; }
      let id = slug(name) + '-' + code10().slice(0, 4);
      while (clientById(id)) id = slug(name) + '-' + code10().slice(0, 4);
      data.clients.push({id, name, code: code10(), programId: pid});
      scheduleDataSave(); break; }
    case 'newlink':
      if (!cl) return;
      if (ui.armed === 'lk:' + cl.id){ cl.code = code10(); ui.armed = null; scheduleDataSave(); }
      else armFor('lk:' + cl.id);
      break;
    case 'rmclient':
      if (!cl) return;
      if (ui.armed === 'cl:' + cl.id){ data.clients = data.clients.filter(c => c.id !== cl.id); ui.armed = null; scheduleDataSave(); }
      else armFor('cl:' + cl.id);
      break;
    case 'lock': ls.del('sb.pin'); ls.del(KEY + '.cache'); location.reload(); return;
    /* programs */
    case 'pid': ui.pid = v; ui.newProg = false; ui.bDay = 0; break;
    case 'newprog': ui.newProg = true; break;
    case 'createprog': {
      const name = document.getElementById('np-name').value.trim() || 'New program', from = progById(document.getElementById('np-from').value);
      const p = {id: 'p' + code10().slice(0, 6), name, days: from ? clone(from.days).map(d => { d.exercises.forEach(x => x.id = uid()); return d; }) : blankDays()};
      data.programs.push(p); ui.pid = p.id; ui.newProg = false; ui.bDay = 0; scheduleDataSave(); break; }
    case 'rmprog':
      if (!prog) return;
      if (ui.armed === 'pg:' + prog.id){ data.programs = data.programs.filter(p => p.id !== prog.id); ui.armed = null; ui.pid = ''; scheduleDataSave(); }
      else armFor('pg:' + prog.id);
      break;
    case 'progpid': ui.progPid = v; break;
    case 'pday': ui.pDayFor[b.dataset.k] = +v; break;
    case 'pexo': { const k = b.dataset.k; ui.pOpen[k] = ui.pOpen[k] === v ? '' : v; break; }
    case 'bday': ui.bDay = +v; break;
    case 'meview': ui.meView = v; break;
    case 'mkself': {
      if (selfClient()) break;
      const p = {id: 'p' + code10().slice(0, 6), name: 'My training', days: blankDays(3)};
      data.programs.push(p); data.clients.push({id: 'me-' + code10().slice(0, 6), name: 'Blake', code: code10(), programId: p.id, self: true});
      scheduleDataSave(); break; }
    case 'ndays': {
      if (!prog) return; const n = Math.min(DAYS, Math.max(1, +v)), cur = prog.days.length;
      if (n > cur){ prog.days = prog.days.concat(blankDays(n).slice(cur)); scheduleDataSave(); }
      else if (n < cur){
        const losing = prog.days.slice(n).some(d => d.exercises.length || d.notes.some(Boolean));
        if (losing && ui.armed !== 'nd:' + prog.id + ':' + n){ armFor('nd:' + prog.id + ':' + n); break; }
        prog.days = prog.days.slice(0, n); ui.armed = null; if (ui.bDay >= n) ui.bDay = 0; scheduleDataSave();
      }
      break; }
    case 'dtype': day.type = v; scheduleDataSave(); break;
    case 'toggle': ui.open[v] = !ui.open[v]; break;
    case 'grp': if (ex){ ex.group = v; scheduleDataSave(); } break;
    case 'ss': day.superset[+v] = !day.superset[+v]; scheduleDataSave(); break;
    case 'addex': { const at = bwIdx(prog), id = uid();
      /* A new exercise only goes into the week being planned. */
      day.exercises.push({id, name:'', group: day.exercises.some(x => x.group === 'A') ? 'B' : 'A', weeks: Array.from({length: MAXW}, (_, w) => w === at ? blankW() : {sets:'', reps:'', note:'', warm:'0'}), custom: true});
      ui.exOpen = id; scheduleDataSave(); break; }
    case 'up': case 'down': {
      const i = day.exercises.indexOf(ex), j = act === 'up' ? i - 1 : i + 1;
      if (ex && j >= 0 && j < day.exercises.length){ [day.exercises[i], day.exercises[j]] = [day.exercises[j], day.exercises[i]]; scheduleDataSave(); }
      break; }
    case 'rm':
      if (ui.armed === b.dataset.ex){
        const at = bwIdx(prog);
        /* Removing takes it out of this week only. If it's then in no week and was never logged, it's deleted. */
        if (ex){
          ex.weeks[at].sets = ''; ex.custom = true;
          const used = ex.weeks.some(r => setCount(r.sets) > 0) || Object.values(logs).some(l => l && l.sets && (l.sets[ex.id] || []).some(s => s && String(s.kg ?? '').trim()));
          if (!used){ day.exercises = day.exercises.filter(x => x.id !== ex.id); if (ui.exOpen === ex.id) ui.exOpen = null; }
        }
        ui.armed = null; scheduleDataSave(); }
      else armFor(b.dataset.ex);
      break;
    case 'resetw': if (ex){ ex.weeks = ex.weeks.map(() => clone(ex.weeks[0])); ex.custom = false; scheduleDataSave(); } break;
    case 'resetn': day.notes = day.notes.map(() => day.notes[0]); day.notesCustom = false; scheduleDataSave(); break;
    case 'resetc': day.cardio = day.cardio.map(() => clone(day.cardio[0])); day.cardioCustom = false; scheduleDataSave(); break;
    default: return;
  }
  render();
});
/* The week being edited in the builder (0-based). */
function bwIdx(prog){ return prog && ui.bWeek && ui.bWeek[prog.id] ? Math.min(lenOf(prog), Math.max(1, ui.bWeek[prog.id])) - 1 : 0; }
/* Set week w, then carry the change forward through the following weeks that had the same value. */
function fwd(get, set, w, val){ set(w, val); }   /* every week is planned on its own */
function syncRows(prefix, rows, keys){ rows.forEach((r, w) => { if (!w) return; keys.forEach(k => { const el = document.getElementById(`${prefix}-${w}-${k}`); if (el) el.value = r[k]; }); }); }
app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'ck-text'){ ui.ckText = t.value; return; }
  if (t.dataset.prog){
    const prog = progById(ui.pid); if (!prog) return;
    const P = prog.id, di = ui.bDay, day = prog.days[di], k = t.dataset.prog, w = +t.dataset.w;
    if (k === 'progname'){
      prog.name = t.value;
      const chip = app.querySelector(`[data-act="pid"][data-v="${P}"]`); if (chip) chip.textContent = prog.name || 'Untitled program';
    } else if (k === 'dayname'){
      day.name = t.value;
      const chip = app.querySelector(`[data-act="bday"][data-v="${di}"]`); if (chip) chip.textContent = day.name || 'Day ' + (di+1);
    } else if (k === 'title'){
      fwd(i => day.titles[i], (i, v) => { day.titles[i] = v; }, w, t.value);
    } else if (k === 'daynote'){
      fwd(i => day.notes[i], (i, v) => { day.notes[i] = v; }, w, t.value);
      day.notesCustom = day.notes.some(n => n !== day.notes[0]);
    } else if (k === 'cardio'){
      const f = t.dataset.k;
      fwd(i => day.cardio[i][f], (i, v) => { day.cardio[i][f] = v; }, w, t.value);
      day.cardioCustom = day.cardio.some(r => !sameRow(r, day.cardio[0]));
    } else {
      const ex = day.exercises.find(x => x.id === t.dataset.ex); if (!ex) return;
      if (k === 'exname'){ ex.name = t.value; const b2 = t.closest('.card') && t.closest('.card').querySelector('.exmid b'); if (b2) b2.textContent = t.value || 'New exercise'; }
      else {
        const f = t.dataset.k, wasOff = !setCount(ex.weeks[w].sets);
        fwd(i => ex.weeks[i][f], (i, v) => { ex.weeks[i][f] = v; }, w, t.value);
        ex.custom = ex.weeks.some(r => !sameRow(r, ex.weeks[0]));
        const card = t.closest('.card'), sum = card && card.querySelector('.exmid .note'); if (sum) sum.textContent = exSummary(ex, w);
      }
    }
    scheduleDataSave(); return;
  }
  if (t.dataset.log === 'set' && t.dataset.k === 'kg'){ const tile = t.closest('.tile'); if (tile) tile.classList.toggle('on', t.value.trim() !== ''); }
  if (t.dataset.log){
    const person = curPerson(), p = getPos(person), l = ensureLog(person, p.week, p.day);
    if (t.dataset.log === 'cardio'){ l.cardio = Object.assign({}, l.cardio, {[t.dataset.k]: t.value}); }
    else {
      l.sets = l.sets || {};
      const arr = l.sets[t.dataset.ex] = (l.sets[t.dataset.ex] || []).slice(), i = +t.dataset.i;
      while (arr.length <= i) arr.push({kg:'', reps:''});
      arr[i] = Object.assign({}, arr[i], {[t.dataset.k]: t.value});
    }
    scheduleLogSave(logId(person, p.week, p.day));
    const hero = document.querySelector('.pbhero');
    if (hero && mode === 'client' && myHistory && phaseOf(myProgram, p.week) === 'Testing'){ const tmp = document.createElement('div'); tmp.innerHTML = pbHero(myHistory); hero.replaceWith(tmp.firstElementChild); }
  }
});
app.addEventListener('focusin', e => {
  const t = e.target;
  if (t.matches && (t.matches('.fld input') || t.matches('.linkrow input')) && t.value) setTimeout(() => { try { t.select(); } catch(_){} }, 0);
});
app.addEventListener('change', e => {
  const t = e.target, k = t.dataset.change;
  if (k === 'pEx'){ ui.pEx = t.value; ls.set('sb.pEx', t.value); render(); }
  else if (k === 'pclient'){ ui.pClient = t.value; ls.set('sb.pClient', t.value); render(); }
  else if (k === 'lgclient'){ ui.person = t.value; ls.set('sb.coachPerson', t.value); render(); }
  else if (k === 'cprog'){ const c = clientById(t.dataset.c); if (c){ c.programId = t.value; scheduleDataSave(); render(); } }
  else if (k === 'tday' || k === 'ttime'){ const c = clientById(t.dataset.c); if (c){ c.train = Object.assign({day: '', time: ''}, c.train, k === 'tday' ? {day: t.value === '' ? '' : +t.value} : {time: t.value}); scheduleDataSave(); render(); } }
});

/* ---------- start ---------- */
function mergeLogs(serverLogs){
  const next = serverLogs || {}, ob = outbox();
  Object.keys(ob).forEach(id => { if (!next[id] || (next[id].updatedAt || 0) < (ob[id].updatedAt || 0)) next[id] = ob[id]; });
  logDirty.forEach(id => { if (logs[id]) next[id] = logs[id]; });
  logs = next; logsLoaded = true;
}
function applyServer(res){
  if (res.mode === 'client'){
    mode = 'client'; me = res.client; myProgram = normProgram(res.program); myHistory = res.history || null; myCheckin = !!res.checkin; mergeLogs(res.logs);
  } else if (res.mode === 'coach'){
    mode = 'coach'; if (!dataDirty){ data = normData(res.data); dataBase = clone(data); } msgs = Array.isArray(res.messages) ? res.messages : []; mergeLogs(res.logs);
  } else {
    mode = res.mode === 'invalid' ? 'invalid' : 'landing';
    if (mode === 'invalid'){ try{ if (localStorage.getItem('bbc.code') === CODE) localStorage.removeItem('bbc.code'); }catch(e){} }
    if (mode === 'landing' && pin()) ls.del('sb.pin');
    ls.del(KEY + '.cache');
    return;
  }
  saveCache();
}
/* ---------- notifications (OneSignal) ---------- */
const OS_APP = '92559721-f9e8-4a87-8c5d-1f568580fe1c';
window.OneSignalDeferred = window.OneSignalDeferred || [];
const push = {ready: false, on: false, asking: false, msg: ''};
const pushCapable = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function pushInit(){
  if (pushInit.started || !(mode === 'client' || mode === 'coach')) return;
  pushInit.started = true;
  OneSignalDeferred.push(async OS => {
    try {
      await OS.init({appId: OS_APP, serviceWorkerPath: 'sw.js', serviceWorkerParam: {scope: '/'}});
      window.__OS = OS;
      await OS.login(mode === 'client' ? me.id : 'coach');
      const upd = () => { push.on = !!(OS.Notifications.permission && OS.User.PushSubscription.optedIn); safeRender(); };
      OS.User.PushSubscription.addEventListener('change', upd);
      OS.Notifications.addEventListener('permissionChange', upd);
      push.ready = true; upd();
    } catch(e){ push.msg = ''; }
  });
}
function pushCard(){
  if (push.on || !(mode === 'client' || mode === 'coach')) return '';
  if (!pushCapable()) return STANDALONE ? '' : `<div class="pushcard"><div class="pc"><b>Get reminders from Blake</b><span>Add this app to your home screen first (Share → Add to Home Screen), then open it from there to turn on notifications.</span></div></div>`;
  if (typeof Notification !== 'undefined' && Notification.permission === 'denied') return `<div class="pushcard"><div class="pc"><b>Notifications are blocked</b><span>Turn them on in your phone's Settings → Notifications → Built by BC.</span></div></div>`;
  return `<div class="pushcard"><div class="pc"><b>${mode === 'coach' ? 'Turn on coach notifications' : 'Turn on notifications'}</b><span>${mode === 'coach' ? 'Get a heads-up when a client replies to a check-in.' : 'Session reminders, check-ins and PB alerts from Blake.'}</span></div><button type="button" class="btn primary" data-act="pushon" ${push.ready && !push.asking ? '' : 'disabled'}>${push.asking ? 'One sec…' : push.ready ? 'Turn on' : 'Loading…'}</button></div>`;
}
const FROM_CK = QS.has('checkin');
function checkinCard(){
  if (mode !== 'client') return '';
  if (ui.ckSent) return `<section class="card ckcard"><b>Sent to Blake 👍</b><span class="note">Thanks for letting him know how you're going.</span></section>`;
  if (!myCheckin && !FROM_CK) return '';
  if (!FROM_CK && !ui.ckOpen) return `<button type="button" class="ckdot" data-act="ckopen"><i></i><b>Blake checked in 💬</b><span>Tap to reply</span></button>`;
  return `<section class="card ckcard"><span class="label">Check-in from Blake</span>
    <p class="ckmsg">Great job with your training session with Blake. How is everything feeling now?</p>
    <textarea id="ck-text" rows="3" placeholder="Type your reply…">${esc(ui.ckText || '')}</textarea>
    <button type="button" class="btn big primary" data-act="ckreply" ${ui.ckBusy ? 'disabled' : ''}>${ui.ckBusy ? 'Sending…' : 'Send to Blake'}</button>
    ${ui.ckErr ? `<span class="note">Couldn't send. Check your connection and try again.</span>` : ''}</section>`;
}
function msgsCard(){
  if (!msgs.length) return '';
  const unread = msgs.filter(m => !m.read).length;
  const when = at => ago(at) + ' · ' + new Date(at).toLocaleTimeString('en-AU', {hour: 'numeric', minute: '2-digit'});
  return `<section class="card msgs"><div class="mhead"><h3>Messages</h3>${unread ? `<span class="pill good">${unread} new</span>` : ''}</div>
    ${msgs.slice(0, ui.msgAll ? 30 : 3).map(m => `<div class="msg ${m.read ? '' : 'new'}"><div class="mtop"><b style="color:${clientColor(m.id)}">${esc(m.name)}</b><span>${esc(when(m.at))}</span></div><p>${esc(m.text)}</p></div>`).join('')}
    ${(msgs.length > 3 || unread) ? `<div class="row">${msgs.length > 3 ? `<button type="button" class="btn link" data-act="msgall">${ui.msgAll ? 'Show less' : 'Show all'}</button>` : ''}${unread ? `<button type="button" class="btn" data-act="msgread">Mark as read</button>` : ''}</div>` : ''}</section>`;
}
function load(){
  return api('getAll', CODE ? '' : pin(), CODE).then(r => { applyServer(JSON.parse(r)); safeRender(); flushOutbox(); pushInit(); },
    () => { if (mode === 'loading'){ mode = 'error'; render(); } else { saveError = true; setStatus(); } });
}
function migrateOldOutbox(){
  /* Weights typed on the first version of the page, not yet sent */
  const old = ls.get('sb.outbox', null); if (!old || !CODE) return;
  const ob = outbox();
  Object.keys(old).forEach(id => { if (id.startsWith(CODE + '-') && !ob[id]) ob[id] = old[id]; });
  ls.set(KEY + '.outbox', ob);
}
function start(){
  if (CODE === 'invalid'){ mode = 'invalid'; render(); return; }
  if (!CODE && !pin()){ mode = 'landing'; render(); return; }
  migrateOldOutbox();
  const cached = ls.get(KEY + '.cache', null);
  if (cached && cached.mode === 'client' && CODE){ mode = 'client'; me = cached.me; myProgram = normProgram(cached.program); myHistory = cached.history || null; myCheckin = !!cached.checkin; logs = cached.logs || {}; }
  else if (cached && cached.mode === 'coach' && !CODE){ mode = 'coach'; data = normData(cached.data); dataBase = clone(data); msgs = cached.msgs || []; logs = cached.logs || {}; }
  if (mode !== 'loading'){ Object.assign(logs, outbox()); logsLoaded = true; }
  render();
  load();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !pending) load(); });
}
start();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
